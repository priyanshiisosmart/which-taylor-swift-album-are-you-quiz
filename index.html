<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which Taylor Swift Album Are You?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kirang+Haerang&display=swap" rel="stylesheet">
<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; overflow:hidden; }
body{
  font-family:"Kirang Haerang",sans-serif; font-weight:400; letter-spacing:.3px;
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.5), transparent 40%),
    radial-gradient(circle at 80% 85%, rgba(255,255,255,.35), transparent 45%),
    linear-gradient(160deg,#ffe2ef 0%, #ffd1e7 45%, #f2c7ec 100%);
  display:flex; align-items:center; justify-content:center;
}
.story{
  position:relative; width:100vw; height:100%; max-width:calc(100vh * 9 / 16);
  display:flex; flex-direction:column; align-items:center; justify-content:safe center;
  padding:calc(28px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));
  text-align:center; overflow-x:hidden; overflow-y:auto;
}
.story{ scrollbar-width:none; -ms-overflow-style:none; }
.story::-webkit-scrollbar{ display:none; }
.screen{ display:none; width:100%; flex-direction:column; align-items:center; }
.screen.active{ display:flex; }
.eyebrow{ font-size:15px; letter-spacing:2px; text-transform:uppercase; color:#a4276b; opacity:.8; margin-bottom:6px; }
.title{ font-size:34px; color:#5a1a4a; line-height:1.15; margin-bottom:16px; }
.sub{ font-size:16px; color:#8a5a7a; margin-bottom:24px; max-width:280px; }
.btn{ border:none; border-radius:999px; padding:14px 34px; background:#cf2a85; color:#fff; font:inherit; font-size:16px; cursor:pointer; box-shadow:0 10px 24px rgba(194,24,91,.35); }
.btn.ghost{ background:#fff8fb; color:#5a1a4a; border:2px dashed #cf2a85; box-shadow:none; }

.vinyl{ width:150px; height:150px; margin-bottom:22px; animation:spin 6s linear infinite; filter:drop-shadow(0 8px 14px rgba(90,26,74,.3)); }
.vinyl.big{ width:170px; height:170px; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.progress{ display:flex; gap:6px; width:100%; max-width:260px; margin-bottom:10px; }
.seg{ flex:1; height:5px; border-radius:3px; background:rgba(90,26,74,.15); }
.seg.done{ background:#cf2a85; }
.count{ font-size:14px; color:#a4276b; opacity:.8; margin-bottom:18px; }
.q{ font-size:22px; color:#5a1a4a; line-height:1.3; max-width:300px; margin-bottom:20px; }
.or{ font-size:14px; color:#a4276b; opacity:.7; margin:-4px 0; }
.choices{ display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; max-width:300px; }
.choice{
  width:100%; display:flex; flex-direction:column; align-items:center; gap:6px;
  background:rgba(255,248,251,.92); border:2px dashed #cf2a85; border-radius:22px;
  padding:13px 14px; font:inherit; font-weight:400; font-size:16px; line-height:1.25; color:#5a1a4a; cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.choice .em{ font-size:30px; line-height:1; }
.choice:active{ transform:scale(.96); background:#ffe1ee; }
.choice.picked{ background:#cf2a85; color:#fff; border-style:solid; transform:scale(1.03); }
.back{ margin-top:16px; background:none; border:none; font:inherit; font-size:15px; color:#a4276b; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.back:disabled{ visibility:hidden; }

.r-title{ font-size:30px; color:#cf2a85; margin:0 0 8px; line-height:1.2; font-weight:400; }
.r-match{ font-family:system-ui,sans-serif; font-size:12px; letter-spacing:.6px; text-transform:uppercase; color:#8a5a7a; margin-bottom:10px; }
.r-blurb{ font-size:16px; color:#8a5a7a; max-width:290px; margin-bottom:14px; }
.r-box{ font-size:14px; color:#5a1a4a; background:rgba(255,248,251,.92); border:2px dashed #cf2a85; border-radius:14px; padding:8px 14px; margin-bottom:10px; max-width:290px; }
.listen{ display:flex; gap:8px; margin-bottom:10px; }
.listen a{ text-decoration:none; border-radius:999px; padding:9px 16px; background:#cf2a85; color:#fff; font-size:14px; box-shadow:0 6px 14px rgba(194,24,91,.3); }
.listen a.alt{ background:#fff8fb; color:#5a1a4a; border:2px dashed #cf2a85; box-shadow:none; padding:7px 14px; }
.embed{ width:100%; max-width:300px; margin-bottom:10px; }
.embed iframe{ display:block; width:100%; height:152px; border:0; border-radius:12px; }
.r-actions{ margin-top:10px; width:100%; max-width:260px; }
.foot{ position:absolute; bottom:calc(14px + env(safe-area-inset-bottom,0px)); left:0; right:0; font-size:12px; color:#a4276b; opacity:.6; }

.stats{ display:none; position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); z-index:5; font-family:system-ui,sans-serif; font-size:12px; color:#5a1a4a; background:rgba(255,248,251,.95); border:2px dashed #cf2a85; border-radius:999px; padding:6px 14px; white-space:nowrap; }
.stats.on{ display:block; }

/* side doodles: stick-figure singers that react to your picks (only when there is room beside the phone-width column) */
:root{ --figH:min(29vh, 240px); }
.doodle{ display:flex; position:fixed; bottom:0; z-index:0; pointer-events:none; width:38vw; height:var(--figH); align-items:flex-end; justify-content:center; }
.doodle.l{ left:0; } .doodle.r{ right:0; }
.doodle svg{ height:100%; width:auto; max-width:100%; overflow:visible; }
/* phones and portrait screens: figures stand small in the bottom corners, behind the quiz */
@media not all and (min-width:820px) and (min-aspect-ratio:1/1){ .story{ padding-bottom:calc(18px + env(safe-area-inset-bottom,0px) + var(--figH) * .7); } .fl{ font-size:24px; } }
/* wide screens: full-height figures in the empty side space */
@media (min-width:820px) and (min-aspect-ratio:1/1){ .doodle{ width:calc((100vw - min(100vw, 100vh * 9 / 16)) / 2); height:100%; padding:0 12px; } .doodle svg{ width:100%; height:auto; max-width:280px; max-height:92vh; } }
.fig{ --dress:#ffc2de; }
.fig .p, .fig .e, .fig .m, .fig .gl{ display:none; }
.fig.has-letter .p-letter, .fig.has-popcorn .p-popcorn, .fig.has-phone .p-phone, .fig.has-phoneoff .p-phoneoff, .fig.has-mug .p-mug, .fig.has-rose .p-rose, .fig.has-ball .p-ball, .fig.has-candle .p-candle, .fig.has-pizza .p-pizza, .fig.has-keys .p-keys, .fig.has-headphones .p-headphones, .fig.has-clip .p-clip,
.fig.has-mic .p-mic, .fig.has-heart .p-heart, .fig.has-pola .p-pola, .fig.has-shades .p-shades, .fig.has-crown .p-crown, .fig.has-guitar .p-guitar, .fig.has-glam .gl{ display:inline; }
.fig[data-eyes="dot"] .e-dot, .fig[data-eyes="heart"] .e-heart, .fig[data-eyes="arc"] .e-arc, .fig[data-eyes="star"] .e-star, .fig[data-eyes="side"] .e-side{ display:inline; }
.fig .sc{ font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; transform-box:fill-box; transform-origin:center; }
.fig .sc.pop{ animation:scPop .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes scPop{ from{ transform:scale(.2) rotate(-20deg); opacity:0; } to{ transform:scale(1) rotate(0); opacity:1; } }
.fig[data-mouth="smile"] .m-smile, .fig[data-mouth="open"] .m-open, .fig[data-mouth="flat"] .m-flat{ display:inline; }
.fig .dress{ fill:var(--dress); transition:fill .5s ease; }
.armL,.armR,.legL,.legR,.head{ transition:transform .5s cubic-bezier(.3,1.5,.5,1); }
.armL{ transform-origin:120px 150px; transform:rotate(calc(var(--al,15) * 1deg)); }
.armR{ transform-origin:120px 150px; transform:rotate(calc(var(--ar,15) * -1deg)); }
.legL{ transform-origin:120px 262px; transform:rotate(calc(var(--ll,0) * 1deg)); }
.legR{ transform-origin:120px 262px; transform:rotate(calc(var(--lr,0) * -1deg)); }
.head{ transform-origin:120px 122px; transform:rotate(calc(var(--tilt,0) * 1deg)); }
.fb{ transform-origin:120px 352px; }
.doodle.r .fb{ animation-delay:-.8s; }
.fig.a-idle .fb{ animation:fIdle 3s ease-in-out infinite; }
.fig.a-jump .fb{ animation:fJump .7s ease-in-out infinite; }
.fig.a-sway .fb{ animation:fSway 1.6s ease-in-out infinite; }
@keyframes fIdle{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
@keyframes fJump{ 0%,100%{ transform:translateY(0) scaleY(.96); } 40%{ transform:translateY(-34px) scaleY(1.03); } }
@keyframes fSway{ 0%,100%{ transform:rotate(-3deg); } 50%{ transform:rotate(3deg); } }
.fig.w-wave .armR{ animation:wvR .55s ease-in-out infinite; }
.fig.w-dance .armL{ animation:wvL .5s ease-in-out infinite; }
.fig.w-dance .armR{ animation:wvR .5s ease-in-out infinite .25s; }
.fig.w-dance .legL{ animation:lgL .5s ease-in-out infinite; }
.fig.w-dance .legR{ animation:lgR .5s ease-in-out infinite .25s; }
@keyframes wvR{ 0%,100%{ transform:rotate(calc(var(--ar,15) * -1deg)); } 50%{ transform:rotate(calc((var(--ar,15) - 28) * -1deg)); } }
@keyframes wvL{ 0%,100%{ transform:rotate(calc(var(--al,15) * 1deg)); } 50%{ transform:rotate(calc((var(--al,15) + 28) * 1deg)); } }
@keyframes lgL{ 0%,100%{ transform:rotate(calc(var(--ll,0) * 1deg)); } 50%{ transform:rotate(calc((var(--ll,0) + 16) * 1deg)); } }
@keyframes lgR{ 0%,100%{ transform:rotate(calc(var(--lr,0) * -1deg)); } 50%{ transform:rotate(calc((var(--lr,0) + 16) * -1deg)); } }
.doodle .twk{ animation:twk 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
.doodle .twk:nth-of-type(2n){ animation-delay:-.8s; } .doodle .twk:nth-of-type(3n){ animation-delay:-1.5s; }
@keyframes twk{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(.7); opacity:.55; } }
.fl{ position:absolute; bottom:48%; font-size:30px; line-height:1; animation:fl 1.5s ease-out forwards; }
@keyframes fl{ from{ transform:translateY(0) scale(.5); opacity:1; } to{ transform:translateY(-150px) scale(1.25); opacity:0; } }
@media (prefers-reduced-motion:reduce){ .fig *, .doodle .twk, .fl{ animation:none !important; } }
</style>
</head>
<body>
<div class="doodle l" id="figL" aria-hidden="true"></div>
<div class="doodle r" id="figR" aria-hidden="true"></div>
<div class="story">

  <div class="screen active" id="intro">
    <div class="title">Which Taylor Swift<br>Album Are You?</div>
    <div id="introVinyl"></div>
    <div class="sub">8 quick picks. No overthinking, just trust your gut ✨</div>
    <button class="btn" id="start" type="button">Drop the needle</button>
  </div>

  <div class="screen" id="quiz">
    <div class="progress" id="progress"></div>
    <div class="count" id="count"></div>
    <div class="q" id="qText"></div>
    <div class="choices" id="choices"></div>
    <button class="back" id="back" type="button">← back</button>
  </div>

  <div class="screen" id="result">
    <div id="resultVinyl"></div>
    <h2 class="r-title" id="rTitle"></h2>
    <div class="r-match" id="rMatch"></div>
    <div class="r-blurb" id="rBlurb"></div>
    <div class="r-box" id="rTrack"></div>
    <div class="embed" id="rEmbed"></div>
    <div class="listen" id="rListen"></div>
    <div class="r-box" id="rRunner"></div>
    <div class="embed" id="rEmbed2"></div>
    <div class="listen" id="rListen2"></div>
    <div class="r-actions"><button class="btn ghost" id="again" type="button">Flip the record</button></div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="foot">by @girlxgram</div>
</div>

<script>
/* Each album has a profile on four 0–1 axes:
   R = wears heart on sleeve, L = loud & bold, N = nostalgic & dreamy, S = sparkly & polished.
   Your picks build your own profile, and the closest album wins. */
const ALBUMS = [
  { id:'taylorswift', name:'Taylor Swift', year:2006, track:'Our Song', color:'#7cc4e8', p:{R:.8,L:.4,N:.7,S:.2}, blurb:'Honest, earnest and a little country. You say exactly what you mean.' },
  { id:'fearless', name:'Fearless', year:2008, track:'Love Story', color:'#f4c95d', p:{R:.9,L:.6,N:.8,S:.7}, blurb:'Golden, hopeful, fairytale energy. You leap first and it usually works out.' },
  { id:'speaknow', name:'Speak Now', year:2010, track:'Enchanted', color:'#7c4fa0', p:{R:.9,L:.8,N:.7,S:.6}, blurb:'A dramatic romantic who says the brave thing out loud, even shaking.' },
  { id:'red', name:'Red', year:2012, track:'All Too Well', color:'#b3122a', p:{R:.6,L:.9,N:.5,S:.4}, blurb:'Big feelings, no apologies. You love loudly and grieve just as loudly.' },
  { id:'1989', name:'1989', year:2014, track:'Style', color:'#8fd8e8', p:{R:.4,L:.9,N:.2,S:.9}, blurb:'Sleek, city-lights confidence. You can turn any bad week into a dance floor.' },
  { id:'reputation', name:'reputation', year:2017, track:'Delicate', color:'#2b2b2b', p:{R:.2,L:.8,N:.1,S:.7}, blurb:'Guarded, sharp and unbothered. You protect your peace fiercely.' },
  { id:'lover', name:'Lover', year:2019, track:'Cruel Summer', color:'#f6b6d2', p:{R:.9,L:.6,N:.6,S:.9}, blurb:'Soft, pastel and a little chaotic. You believe in love and in glitter.' },
  { id:'folklore', name:'folklore', year:2020, track:'cardigan', color:'#8a8f87', p:{R:.6,L:.1,N:.8,S:.1}, blurb:'Cabin-and-cardigan energy. You feel everything quietly and deeply.' },
  { id:'evermore', name:'evermore', year:2020, track:'willow', color:'#a9713f', p:{R:.5,L:.2,N:.6,S:.2}, blurb:'A bit wilder than folklore. You turn every feeling into a whole story.' },
  { id:'midnights', name:'Midnights', year:2022, track:'Anti-Hero', color:'#2b3a67', p:{R:.3,L:.4,N:.3,S:.6}, blurb:'3am thoughts, sharp wit and a lovable spiral. You overthink in style.' },
  { id:'ttpd', name:'The Tortured Poets Department', year:2024, track:'So Long, London', color:'#b9b2a6', p:{R:.3,L:.5,N:.4,S:.1}, blurb:'You write it down first and feel it second. Dramatic, literary, unfiltered.' },
  { id:'showgirl', name:'The Life of a Showgirl', year:2025, track:'The Fate of Ophelia', color:'#e8b13a', p:{R:.5,L:.9,N:.2,S:.9}, blurb:'Center stage, full sparkle. You were always going to end up here.' }
];

/* v = 1 pushes your profile up on that axis, 0 pushes it down */
const QUESTIONS = [
  { q:'Saturday night, you\u2019d rather be\u2026', a:{ em:'💌', t:'Writing a love letter you\u2019ll maybe send', ax:'R', v:1 }, b:{ em:'🎬', t:'Movie night with my favorite people', ax:'R', v:0.5 }, c:{ em:'🕶️', t:'Phone off, nobody gets access to me', ax:'R', v:0 } },
  { q:'Karaoke night. You\u2026', a:{ em:'🎤', t:'Grab the mic and go full performance', ax:'L', v:1 }, b:{ em:'🎶', t:'Join a big group number with everyone', ax:'L', v:0.5 }, c:{ em:'🛋️', t:'Sing along from the couch', ax:'L', v:0 } },
  { q:'Your camera roll is mostly\u2026', a:{ em:'📼', t:'Old memories I keep revisiting', ax:'N', v:1 }, b:{ em:'🖼️', t:'A mix of old favorites and new', ax:'N', v:0.5 }, c:{ em:'📱', t:'Whatever is happening right now', ax:'N', v:0 } },
  { q:'Pick your getting-ready look', a:{ em:'💎', t:'Full glam, hair and makeup done', ax:'S', v:1 }, b:{ em:'✨', t:'Cute outfit, quick gloss and done', ax:'S', v:0.5 }, c:{ em:'👖', t:'Jeans and a tee, hair in a clip', ax:'S', v:0 } },
  { q:'A first date should feel like\u2026', a:{ em:'🌹', t:'Candlelight, all in from minute one', ax:'R', v:1 }, b:{ em:'☕', t:'Coffee and good conversation', ax:'R', v:0.5 }, c:{ em:'🎳', t:'Casual and light, watching for red flags', ax:'R', v:0 } },
  { q:'Your perfect room is\u2026', a:{ em:'🪩', t:'Packed, loud, lights flashing', ax:'L', v:1 }, b:{ em:'🍕', t:'A house party with my friends', ax:'L', v:0.5 }, c:{ em:'🕯️', t:'Small, candlelit, four people', ax:'L', v:0 } },
  { q:'You\u2019d rather live in\u2026', a:{ em:'🏰', t:'A fairytale', ax:'N', v:1 }, b:{ em:'🏡', t:'A cozy small town', ax:'N', v:0.5 }, c:{ em:'🌆', t:'The real city, sharp and right now', ax:'N', v:0 } },
  { q:'Your ideal soundtrack is\u2026', a:{ em:'🎹', t:'Glossy synths and huge hooks', ax:'S', v:1 }, b:{ em:'🎧', t:'Dreamy indie pop', ax:'S', v:0.5 }, c:{ em:'🎸', t:'Acoustic guitar and strings', ax:'S', v:0 } }
];

/* ===== SPOTIFY ALBUM EMBEDS =====
   Each value is the ID from an open.spotify.com/album/XXXX link.
   Leave '' to fall back to the Play on Spotify / YouTube buttons for that album. */
const SPOTIFY_ALBUM_IDS = {
  taylorswift: '3fIMd26aazkglvPqOiB7WZ',  // Taylor Swift
  fearless: '4hDok0OAJd57SGIT8xuWJH',     // Fearless (Taylor's Version)
  speaknow: '5AEDGbliTTfjOB8TSm1sxt',     // Speak Now (Taylor's Version)
  red: '6kZ42qRrzov54LcAk4onW9',          // Red (Taylor's Version)
  '1989': '64LU4c1nfjz1t4VnGhagcg',       // 1989 (Taylor's Version)
  reputation: '6DEjYFkNZh67HP7R9PSZvv',   // reputation
  lover: '1NAmidJlEaVgA3MpcPFYGq',        // Lover
  folklore: '2fenSS68JI1h4Fo296JfGr',     // folklore
  evermore: '2Xoteh7uEpea4TohMxjtaq',     // evermore
  midnights: '151w1FgRZfnKZA9FEcg9Z3',    // Midnights
  ttpd: '1Mo4aZ8pdj6L1jx8zSwJnt',         // The Tortured Poets Department
  showgirl: '4a6NzYL1YHRUgx9e3YZI6I'      // The Life of a Showgirl
};

const $ = function(id){ return document.getElementById(id); };
let idx = 0, picks = [], locked = false;

function vinyl(color, big){
  const label = color === '#2b2b2b' ? '#5a5a5a' : color;
  return '<svg class="vinyl' + (big ? ' big' : '') + '" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="50" cy="50" r="48" fill="#2b163a"/>' +
    '<circle cx="50" cy="50" r="40" fill="none" stroke="#4a2a5c" stroke-width="1"/>' +
    '<circle cx="50" cy="50" r="33" fill="none" stroke="#4a2a5c" stroke-width="1"/>' +
    '<circle cx="50" cy="50" r="26" fill="none" stroke="#4a2a5c" stroke-width="1"/>' +
    '<path d="M50,6 A44,44 0 0 1 90,32" fill="none" stroke="#fff" stroke-width="2" opacity=".25" stroke-linecap="round"/>' +
    '<circle cx="50" cy="50" r="17" fill="' + label + '" stroke="#fff" stroke-width="1.5"/>' +
    '<circle cx="50" cy="50" r="3" fill="#ffe1ee"/></svg>';
}

function show(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  $(id).classList.add('active');
}

function renderQ(){
  const q = QUESTIONS[idx];
  if(idx > 0 && picks[idx - 1]) react(idx - 1, picks[idx - 1], false); else look(INTRO_LOOK);
  $('progress').innerHTML = QUESTIONS.map(function(_, i){ return '<div class="seg' + (i < idx ? ' done' : '') + '"></div>'; }).join('');
  $('count').textContent = (idx + 1) + ' of ' + QUESTIONS.length;
  $('qText').textContent = q.q;
  $('back').disabled = idx === 0;
  const html = function(o, k){
    return '<button class="choice' + (picks[idx] === k ? ' picked' : '') + '" type="button" data-k="' + k + '"><span class="em">' + o.em + '</span>' + o.t + '</button>';
  };
  $('choices').innerHTML = html(q.a, 'a') + '<div class="or">or</div>' + html(q.b, 'b') + '<div class="or">or</div>' + html(q.c, 'c');
  $('choices').querySelectorAll('.choice').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(locked) return;            /* ignore extra taps while moving on */
      locked = true;
      const qi = idx;
      picks[qi] = btn.dataset.k;
      /* clear any previously selected answer (e.g. after going back) so only the new pick is highlighted */
      $('choices').querySelectorAll('.choice.picked').forEach(function(b){ b.classList.remove('picked'); });
      btn.classList.add('picked');
      react(qi, btn.dataset.k, true);
      setTimeout(function(){
        locked = false;
        idx = qi + 1;
        if(idx >= QUESTIONS.length) showResult(); else renderQ();
      }, 260);
    });
  });
  show('quiz');
}

function showResult(){
  /* build your profile: average of your picks on each axis */
  const sum = {R:0,L:0,N:0,S:0}, n = {R:0,L:0,N:0,S:0};
  QUESTIONS.forEach(function(q, i){
    const o = q[picks[i]];
    if(!o) return;
    sum[o.ax] += o.v; n[o.ax]++;
  });
  const me = {};
  Object.keys(sum).forEach(function(k){ me[k] = n[k] ? sum[k] / n[k] : .5; });

  const ranked = ALBUMS.map(function(a){
    let d = 0;
    Object.keys(me).forEach(function(k){ d += Math.pow(me[k] - a.p[k], 2); });
    return { a:a, d:Math.sqrt(d) + Math.random() * 0.001 };
  }).sort(function(x, y){ return x.d - y.d; });

  const best = ranked[0], second = ranked[1];
  const pct = function(r){ return Math.max(55, Math.round(100 - r.d * 38)); };
  $('resultVinyl').innerHTML = vinyl(best.a.color, true);
  $('rTitle').textContent = best.a.name;
  $('rMatch').textContent = pct(best) + '% match \u00b7 ' + best.a.year;
  $('rBlurb').textContent = best.a.blurb;
  $('rTrack').textContent = '\ud83d\udcbf play the full album';
  const player = function(al, embedId, listenId){
    const sid = (SPOTIFY_ALBUM_IDS[al.id] || '').replace(/[^A-Za-z0-9]/g, '');
    $(embedId).innerHTML = sid
      ? '<iframe src="https://open.spotify.com/embed/album/' + sid + '?utm_source=generator" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="' + al.name + '"></iframe>'
      : '';
    $(listenId).style.display = sid ? 'none' : 'flex';
    const q = encodeURIComponent(al.name + ' Taylor Swift album');
    $(listenId).innerHTML = '<a href="https://open.spotify.com/search/' + q + '" target="_blank" rel="noopener">\u25b6 Play on Spotify</a>' +
      '<a class="alt" href="https://www.youtube.com/results?search_query=' + q + '" target="_blank" rel="noopener">YouTube</a>';
  };
  player(best.a, 'rEmbed', 'rListen');
  $('rRunner').textContent = 'runner-up: ' + second.a.name + ' (' + pct(second) + '%)';
  player(second.a, 'rEmbed2', 'rListen2');
  show('result');
  lookAlbum(best.a);
  track(best.a.id);
}

function look(L){
  const P = POSES[L.pose] || POSES.idle;
  figEls.forEach(function(f){
    const s = f.svg, st = s.style;
    st.setProperty('--al', P.al); st.setProperty('--ar', P.ar);
    st.setProperty('--ll', P.ll); st.setProperty('--lr', P.lr); st.setProperty('--tilt', P.tilt);
    if(L.dress) st.setProperty('--dress', L.dress);
    s.setAttribute('class', 'fig a-' + P.a + (P.w ? ' w-' + P.w : '') + (L.props || []).map(function(p){ return ' has-' + p; }).join(''));
    s.setAttribute('data-eyes', L.eyes || 'dot');
    s.setAttribute('data-mouth', L.mouth || 'smile');
    [['.sc-side', L.scene], ['.sc-back', L.back]].forEach(function(pair){
      const el = s.querySelector(pair[0]), em = pair[1] || '';
      if(el.textContent !== em){
        el.textContent = em;
        el.classList.remove('pop');
        if(em){ void el.getBoundingClientRect(); el.classList.add('pop'); }
      }
    });
  });
}
function burst(list){
  [].concat(list).forEach(function(em, k){
    figEls.forEach(function(f){
      const el = document.createElement('span');
      el.className = 'fl'; el.textContent = em;
      el.style.left = (22 + Math.random() * 50) + '%';
      el.style.animationDelay = (k * 0.15) + 's';
      f.box.appendChild(el);
      el.addEventListener('animationend', function(){ el.remove(); });
    });
  });
}

/* ===== ANONYMOUS PLAYER TRACKING =====
   Paste your Google Apps Script web app URL below (see setup steps).
   Each browser gets a random anonymous ID; every finished quiz logs one row.
   Add #stats to your page URL to see the totals. */
const TRACK_URL = 'https://script.google.com/macros/s/AKfycbwH8FNmoe0wrCL3ZqHpn0FolGWCAalYjiBdpSGItbuOPZIa-71GxyrauN37l6iwARU9pw/exec';
function visitorId(){
  try{
    let v = localStorage.getItem('tsq_vid');
    if(!v){ v = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'v' + Date.now() + Math.random().toString(36).slice(2); localStorage.setItem('tsq_vid', v); }
    return v;
  }catch(e){ return 'noid'; }
}
function track(albumId){
  if(!TRACK_URL) return;
  try{
    fetch(TRACK_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ id:visitorId(), album:albumId }), keepalive:true }).catch(function(){});
  }catch(e){}
}
function showStats(){
  if(!TRACK_URL || location.hash !== '#stats') return;
  fetch(TRACK_URL).then(function(r){ return r.json(); }).then(function(d){
    const el = $('stats');
    el.textContent = '\ud83d\udc64 ' + d.unique + ' unique \u00b7 \ud83d\udd01 ' + d.repeat + ' repeat \u00b7 ' + d.plays + ' plays';
    el.classList.add('on');
  }).catch(function(){});
}
showStats();
